name: Build & Push to ACR

# Requires AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID as
# GitHub secrets (OIDC federated credential) before this can run.

on:
  push:
    branches: [main]
    # Release tags. A tag build pushes :vX.Y.Z + :sha and deliberately
    # NOT :latest — a release can legitimately be cut on an older commit,
    # and having it drag :latest backwards would make "cut a release"
    # silently roll the live deployment back. Branch pushes own :latest;
    # tags own the pinned version. See uc-infra/docs/RELEASES.md.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: unitillacr01.azurecr.io
  IMAGE: unitillacr01.azurecr.io/universal-core
  # arm64 (the Pi nodes) + amd64 (mini-pc-main, added to the homelab
  # cluster 2026-07-26/27) — a single-platform image can now land on
  # either node's architecture and crash-loop with "exec format error"
  # on the wrong one. See QUEUE.md's 2026-07-27 hairpin-NAT incident
  # entry, which flagged this as a real, not yet triggered, risk.
  PLATFORMS: linux/arm64,linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      # Only load-bearing for tag (release) builds — see the release-tests
      # step below. Cheap to start unconditionally, and conditional
      # service blocks aren't supported anyway.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and test first
        run: |
          go build ./...
          go vet ./...

      # A release tag never triggers ci.yml (its `on` has no tags entry),
      # so without this a :vX.Y.Z image — the thing RELEASES.md calls the
      # trustworthy rollback target — would ship gated on nothing but
      # build+vet. Branch pushes skip it here because ci.yml already runs
      # the identical suite for them in parallel; running it twice would
      # only slow :latest down. (Independent review flagged the gap.)
      - name: Run the full test suite (release builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_core_test?sslmode=disable
        run: go test ./... -race -count=1 -p 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name unitillacr01

      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # Version tag ONLY — no :latest (a release on an older commit
            # must not roll the live deployment back) and no :sha (the
            # branch build already pushed it, and a second independent
            # build is not byte-identical, so re-pushing would silently
            # repoint :sha at different bits).
            {
              echo "tags<<EOF"
              echo "${IMAGE}:${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${IMAGE}:${GITHUB_SHA}"
              echo "${IMAGE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
