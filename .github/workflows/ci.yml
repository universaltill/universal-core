name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Runs the DB-backed suite for real (workflow queue, csvimport
      # Commit, foundation/definition registries) instead of letting
      # TEST_DATABASE_URL-unset skip them silently, the way a local run
      # without a database does.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_core_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prep Go cache dirs
        run: |
          mkdir -p "${RUNNER_TEMP}/gobuildcache"
          mkdir -p "${RUNNER_TEMP}/gomodcache"
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gobuildcache
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: gofmt check
        run: |
          FMT_OUT="$(gofmt -l .)"
          if [ -n "$FMT_OUT" ]; then
            echo "The following files need gofmt:" >&2
            echo "$FMT_OUT" >&2
            exit 1
          fi
      - name: Build
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go build ./...
      - name: Vet
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go vet ./...
      # Through cmd/migrate (internal/db.Apply, schema_migrations-tracked)
      # rather than applying internal/db/migrations/*.sql directly with
      # psql — a second, untracked path here would drift from what
      # cmd/universal-core itself does on boot (it did: internal/db's own
      # tests call Apply() too, and previously found the schema already
      # present with nothing recorded, then tried to re-run 001_init.sql
      # into it).
      - name: Apply migrations
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go run ./cmd/migrate
      # internal/kernel/saft's tests validate generated SAF-T files
      # against the vendored Skatteetaten XSD via xmllint; without it the
      # validation tests skip, and CI must never silently skip them.
      - name: Install xmllint for SAF-T XSD validation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # internal/e2e's 49 real-browser tests need Chrome/Chromium on
      # PATH (internal/e2e/csv_import_test.go's findBrowser) — ubuntu-
      # latest ships google-chrome-stable today, but this asserts it
      # explicitly (same reasoning as xmllint above) instead of trusting
      # that ambient fact silently forever. Belt-and-suspenders with
      # findBrowser's own CI-env hard-failure: if this step ever starts
      # failing, that's the loud signal; if the runner image changes in
      # some way this miss, findBrowser fails the build too, rather than
      # 49 tests quietly skipping (found 2026-08-02, independent review
      # of uc-infra#56 — a coverage baseline measured on a machine
      # without a browser had silently skipped all of them).
      - name: Confirm a real browser is available for internal/e2e
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || {
            echo "::error::No Chrome/Chromium binary found on PATH — internal/e2e's 49 real-browser tests need one. findBrowser will now hard-fail (not skip) in CI, so this step existing separately is just an earlier, clearer signal of the same problem."
            exit 1
          }

      - name: Test
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        # -p 1: every package's tests share ONE live Postgres database
        # (TEST_DATABASE_URL above) — fine while packages only touch their
        # own tenant-scoped rows, but internal/worker's tests run real
        # background pollers against workflow_jobs, and
        # ClaimNext/ReclaimStale are deliberately tenant-*global* (a real
        # deployment has one shared dispatcher servicing every tenant, see
        # queue.go). Without -p 1, Go runs different packages' test
        # binaries concurrently by default, so internal/worker's poller
        # can claim a job internal/kernel/workflow's own synchronous test
        # just enqueued before that test's own ProcessOne call reaches it
        # — a real, if intermittent, cross-package race (first seen
        # 2026-07-21, several merges after internal/worker landed, not on
        # every run). -p 1 serializes package-level test execution so the
        # two can never overlap; -race stays for the same-package data-race
        # detection it's always done, unaffected by this. -timeout=30m:
        # explicit rather than relying on `go test`'s 10-minute default —
        # internal/api alone runs ~5 minutes DB-backed, and this runner
        # also carries internal/e2e's real-Chrome tests on top of it.
        #
        # -coverpkg covers every package EXCEPT cmd/*: those are thin
        # main()-wrapper binaries (their own tests still run as part of
        # ./... below — this only affects what's attributed toward the
        # coverage total, not what actually executes). This is NOT the
        # same exclusion the 2026-07-29 coverage audit used (that audit
        # excluded cmd/ from the test run itself, `./...` minus cmd/, and
        # kept `-coverpkg=./...` — i.e. cmd/ out of both the numerator
        # AND denominator differently than here); this workflow's number
        # and that audit's 82.9%/78.7% are measured on different scopes
        # and are NOT directly comparable. Don't diff them expecting to
        # see whether coverage rose or fell — this gate's own floor
        # (below) is the only number this measurement should ever be
        # compared against.
        #
        # set -euo pipefail: without it, a `go list` failure would empty
        # COVERPKGS silently and `-coverpkg=""` is accepted by `go test`
        # (falls back to plain per-package coverage) rather than erroring
        # — found in independent review, verified by reproducing it.
        run: |
          set -euo pipefail
          COVERPKGS=$(go list ./... | grep -v '/cmd/' | tr '\n' ',' | sed 's/,$//')
          if [ -z "$COVERPKGS" ]; then
            echo "::error::go list produced no non-cmd packages — refusing to run with an empty -coverpkg (would silently fall back to plain per-package coverage)."
            exit 1
          fi
          go test ./... -race -count=1 -p 1 -timeout=30m -coverprofile=coverage.out -coverpkg="$COVERPKGS" -covermode=atomic

      - name: Coverage gate
        if: always()
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        # Floor only ever ratchets up (CLAUDE.md's "Testing" section) —
        # never lower this number to make a change pass; close the gap
        # with tests instead. Baseline set 2026-08-02 from this same
        # measurement, with a real browser present so internal/e2e's 49
        # tests actually ran rather than skipping (see
        # uc-infra/docs/code-reviews/2026-08-02-tdd-coverage-gate.md for
        # the full baseline run and why the first attempt was discarded).
        # `if: always()`: run even if the Test step above already failed,
        # so a failing build still gets a coverage breakdown to look at.
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out not found — the Test step above did not produce one (likely failed before finishing); nothing to gate."
            exit 1
          fi
          echo "--- Lowest-covered functions (bottom 15) ---"
          go tool cover -func=coverage.out | grep -v '^total:' | sort -t$'\t' -k3 -n | head -15
          echo "---"
          COVERAGE_FLOOR=CI_BASELINE_PLACEHOLDER
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Whole-program coverage: ${TOTAL}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$TOTAL" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "::error::Coverage ${TOTAL}% is below the ${COVERAGE_FLOOR}% floor. This gate only ratchets up — add tests to close the gap, never lower the floor to pass."
            exit 1
          }
