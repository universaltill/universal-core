name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Runs the DB-backed suite for real (workflow queue, csvimport
      # Commit, foundation/definition registries) instead of letting
      # TEST_DATABASE_URL-unset skip them silently, the way a local run
      # without a database does.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universal_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_core_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/universal_core_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # A script nothing runs is only ever read, not verified — this
      # exercises check-coverage-floor.sh's own comparison logic against
      # fixtures (including a real-ci.yml-based case) before the tamper
      # check below trusts it against a real PR. Always runs, unlike the
      # tamper check itself, since it's testing the script, not doing a
      # PR-specific comparison — no reason to skip it on a plain push.
      - name: Coverage floor script self-test
        run: .github/scripts/check-coverage-floor_test.sh
      # Tamper-resistance for the Coverage gate step's floor, below: the
      # same PR that regresses coverage can otherwise also lower
      # COVERAGE_FLOOR to make itself pass, with nothing structural
      # stopping it (found via uc-infra#56's independent review,
      # uc-infra#113). Runs only on pull_request — a plain push to main
      # has no base ref to diff the floor against. Placed first, before
      # Go is even set up, so a tampered PR fails in seconds rather than
      # after the full DB-backed test run below.
      #
      # Honest gap: a direct push to main (bypassing a PR) isn't checked
      # at all — nothing here stops that push from lowering the floor.
      # This pipeline has no tool access to configure branch protection
      # requiring PRs, so that gap isn't closed, only named.
      #
      # Fetches the PR's base commit by SHA, not by branch name. This
      # doesn't pin to "the commit the PR was opened against" — GitHub's
      # `pull_request.base.sha` is the base tip as of the triggering
      # event and moves across `synchronize` events like any other base
      # ref — but it does mean this run compares against the exact base
      # commit *this* CI run's event payload named, not a branch tip
      # that could have moved again by the time the comparison executes.
      #
      # One documented approximation: for pull_request events,
      # actions/checkout@v4's default ref is the merge commit (base
      # merged with head), not the raw PR head, so ".github/workflows/
      # ci.yml" on disk here is technically that merge result. In the
      # normal case (no conflicting concurrent edit to this exact line)
      # that's equivalent to the PR's own value — flagging it as an
      # accepted approximation rather than a silent assumption.
      #
      # Known, accepted gap: check-coverage-floor.sh only catches a
      # *lowered numeric value* at a single anchored assignment. It does
      # not stop someone deleting the whole Coverage gate step, or
      # editing this very tamper-check step/script in the same PR that
      # also lowers the floor (pull_request checkout includes the PR's
      # own workflow changes, so a sufficiently determined PR can disable
      # its own check) — that's a heavier structural fix (a separate
      # checked-in file with CODEOWNERS/branch-protection was
      # uc-infra#113's Option 2, deliberately not built here: this
      # pipeline has no tool access to configure branch protection). The
      # Reviewer step's own manual check (reviewer/SKILL.md: "confirm the
      # diff doesn't drop ci.yml's whole-program coverage threshold")
      # stays as defense-in-depth for what this script can't see.
      - name: Coverage floor tamper check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          git show ${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml > "${RUNNER_TEMP}/base-ci.yml"
          .github/scripts/check-coverage-floor.sh .github/workflows/ci.yml "${RUNNER_TEMP}/base-ci.yml"
      # Same self-test-before-trusting-it discipline as the Coverage
      # floor script self-test above, for check-help-allowlist.sh
      # (uc-infra#146's help-coverage gate, CLAUDE.md's "In-product help
      # manual" section) — always runs, not gated on pull_request.
      - name: Help allowlist script self-test
        run: .github/scripts/check-help-allowlist_test.sh
      # Tamper-resistance for internal/help/coverage_test.go's
      # undocumentedAllowlist: the same PR that grandfathers a newly-
      # shipped, undocumented entity type into the allowlist can
      # otherwise make that pass with nothing structural stopping it —
      # found via independent review of uc-infra#146 itself (an earlier
      # version of this gate tried to enforce the ratchet with a second
      # Go map literal in the same file/commit, which is not a ratchet:
      # a PR editing that file can edit both literals together). Same
      # base-ref-anchoring, same placement (before Go is set up), and
      # the same accepted/named gaps as the Coverage floor tamper check
      # above — see check-help-allowlist.sh's own header for the exact
      # list rather than duplicating it here.
      - name: Help allowlist tamper check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1
          git show ${{ github.event.pull_request.base.sha }}:internal/help/coverage_test.go > "${RUNNER_TEMP}/base-coverage_test.go" 2>/dev/null || true
          .github/scripts/check-help-allowlist.sh internal/help/coverage_test.go "${RUNNER_TEMP}/base-coverage_test.go"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prep Go cache dirs
        run: |
          mkdir -p "${RUNNER_TEMP}/gobuildcache"
          mkdir -p "${RUNNER_TEMP}/gomodcache"
      - name: Restore Go cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/gobuildcache
            ${{ runner.temp }}/gomodcache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: gofmt check
        run: |
          FMT_OUT="$(gofmt -l .)"
          if [ -n "$FMT_OUT" ]; then
            echo "The following files need gofmt:" >&2
            echo "$FMT_OUT" >&2
            exit 1
          fi
      - name: Build
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go build ./...
      - name: Vet
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go vet ./...
      # Through cmd/migrate (internal/db.Apply, schema_migrations-tracked)
      # rather than applying internal/db/migrations/*.sql directly with
      # psql — a second, untracked path here would drift from what
      # cmd/universal-core itself does on boot (it did: internal/db's own
      # tests call Apply() too, and previously found the schema already
      # present with nothing recorded, then tried to re-run 001_init.sql
      # into it).
      - name: Apply migrations
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        run: go run ./cmd/migrate
      # internal/kernel/saft's tests validate generated SAF-T files
      # against the vendored Skatteetaten XSD via xmllint; without it the
      # validation tests skip, and CI must never silently skip them.
      - name: Install xmllint for SAF-T XSD validation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # internal/e2e's 49 real-browser tests need a Chrome/Chromium
      # binary (internal/e2e/browser_discovery_test.go's findBrowser) —
      # ubuntu-latest ships google-chrome-stable on PATH today, but this
      # asserts it explicitly (same reasoning as xmllint above) instead
      # of trusting that ambient fact silently forever. This check is
      # PATH-only on purpose: findBrowser also falls back to
      # $PLAYWRIGHT_BROWSERS_PATH for Playwright-provisioned sandboxes
      # (uc-infra#122), but this workflow never sets that variable, so
      # PATH is the only route GitHub Actions itself actually takes.
      # Belt-and-suspenders with findBrowser's own CI-env hard-failure:
      # if this step ever starts failing, that's the loud signal; if the
      # runner image changes in some way this misses, findBrowser fails
      # the build too, rather than 49 tests quietly skipping (found
      # 2026-08-02, independent review of uc-infra#56 — a coverage
      # baseline measured on a machine without a browser had silently
      # skipped all of them).
      - name: Confirm a real browser is available for internal/e2e
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || {
            echo "::error::No Chrome/Chromium binary found on PATH — internal/e2e's 49 real-browser tests need one. findBrowser will now hard-fail (not skip) in CI, so this step existing separately is just an earlier, clearer signal of the same problem."
            exit 1
          }

      # Same self-test-before-trusting-it discipline as the "Coverage
      # floor script self-test" / "Help allowlist script self-test" steps
      # near the top of this job, for scripts/run-full-gate.sh
      # (uc-infra#215's one-shot local/pipeline-session gate runner) —
      # "a script nothing runs is only ever read, not verified" applies
      # here too. Placed HERE, not alongside those two — unlike them,
      # this harness spawns real subprocess invocations of
      # run-full-gate.sh itself, whose own preflight now checks for
      # xmllint and a browser (uc-infra#215's independent review found
      # both were silently unchecked in the first draft); running it
      # any earlier than this would trip those checks against a runner
      # image that hasn't installed xmllint yet, which is a real ordering
      # bug this exact placement fixes (found the hard way: an earlier
      # version of this step sat with the other two self-tests, before
      # Go/xmllint setup, and failed CI on its own PR for exactly this
      # reason). Still needs no Go toolchain and no live-Postgres schema
      # itself — DB reachability is the one precondition this harness
      # can't fake, and it doesn't attempt to.
      - name: Full-gate script self-test
        run: scripts/run-full-gate_test.sh

      - name: Test
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        # -p 1: every package's tests share ONE live Postgres database
        # (TEST_DATABASE_URL above) — fine while packages only touch their
        # own tenant-scoped rows, but internal/worker's tests run real
        # background pollers against workflow_jobs, and
        # ClaimNext/ReclaimStale are deliberately tenant-*global* (a real
        # deployment has one shared dispatcher servicing every tenant, see
        # queue.go). Without -p 1, Go runs different packages' test
        # binaries concurrently by default, so internal/worker's poller
        # can claim a job internal/kernel/workflow's own synchronous test
        # just enqueued before that test's own ProcessOne call reaches it
        # — a real, if intermittent, cross-package race (first seen
        # 2026-07-21, several merges after internal/worker landed, not on
        # every run). -p 1 serializes package-level test execution so the
        # two can never overlap; -race stays for the same-package data-race
        # detection it's always done, unaffected by this. -timeout=30m:
        # explicit rather than relying on `go test`'s 10-minute default —
        # internal/api alone runs ~5 minutes DB-backed, and this runner
        # also carries internal/e2e's real-Chrome tests on top of it.
        #
        # -coverpkg covers every package EXCEPT cmd/*: those are thin
        # main()-wrapper binaries (their own tests still run as part of
        # ./... below — this only affects what's attributed toward the
        # coverage total, not what actually executes). This is NOT the
        # same exclusion the 2026-07-29 coverage audit used (that audit
        # excluded cmd/ from the test run itself, `./...` minus cmd/, and
        # kept `-coverpkg=./...` — i.e. cmd/ out of both the numerator
        # AND denominator differently than here); this workflow's number
        # and that audit's 82.9%/78.7% are measured on different scopes
        # and are NOT directly comparable. Don't diff them expecting to
        # see whether coverage rose or fell — this gate's own floor
        # (below) is the only number this measurement should ever be
        # compared against.
        #
        # set -euo pipefail: without it, a `go list` failure would empty
        # COVERPKGS silently and `-coverpkg=""` is accepted by `go test`
        # (falls back to plain per-package coverage) rather than erroring
        # — found in independent review, verified by reproducing it.
        #
        # `tee "${RUNNER_TEMP}/test-output.log"` (uc-infra#240): the
        # postgres service container's own stdout gets flushed into this
        # job's log as one giant burst at container-teardown time, big
        # enough to exhaust every log-fetch tool's effective return-size
        # cap before a tail-based fetch can reach back to this step's own
        # `go test` output — so this step also writes its own output to a
        # dedicated file the "Publish failing test output" step below can
        # read directly, independent of the rest of the job log. `tee`
        # doesn't change `go test`'s exit code reaching this script:
        # `pipefail` (already set) makes the pipeline's exit status the
        # last non-zero of `go test`/`tee`, and `tee` itself only fails on
        # a write error.
        run: |
          set -euo pipefail
          COVERPKGS=$(go list ./... | grep -v '/cmd/' | tr '\n' ',' | sed 's/,$//')
          if [ -z "$COVERPKGS" ]; then
            echo "::error::go list produced no non-cmd packages — refusing to run with an empty -coverpkg (would silently fall back to plain per-package coverage)."
            exit 1
          fi
          go test ./... -race -count=1 -p 1 -timeout=30m -coverprofile=coverage.out -coverpkg="$COVERPKGS" -covermode=atomic 2>&1 | tee "${RUNNER_TEMP}/test-output.log"

      # uc-infra#240: surfaces the actual `go test` failure detail (which
      # subtest, its output) through $GITHUB_STEP_SUMMARY — a channel
      # separate from the job log the postgres service container's own
      # teardown-time stdout burst dominates, so a cloud pipeline session
      # (or anyone else) can see *which* test failed without needing a
      # tail-based fetch of the whole job log to reach it. `if: failure()`
      # runs this whenever an earlier step failed, not only Test itself —
      # harmless when `test-output.log` doesn't exist (an earlier step,
      # e.g. Vet, failed first): reported as such rather than erroring.
      #
      # `grep -B 60 -A 30 -- '--- FAIL:'` captures each failing (sub)test's
      # surrounding output — a heuristic, not a precise per-test extraction
      # (Go doesn't emit a machine-clean per-test boundary in plain-text
      # mode; `-json` would, but that would also make this step's own
      # *human-readable* log output harder to skim, which is the more
      # common way this is actually read). The wide, asymmetric window is
      # deliberate, not arbitrary: a `-race` report prints a `WARNING: DATA
      # RACE` header and two full goroutine stacks (~45-60 lines) *before*
      # its `--- FAIL:` line, and a panic's own stack trace prints *after*
      # it — independent review (uc-infra#240) verified empirically that
      # the previous `-B 20`-only version silently dropped the race header
      # and the panic stack, i.e. exactly the failure information this step
      # exists to surface. Still an approximation for a pathologically long
      # single-goroutine stack; `tail -c 900000` (below) is the backstop.
      #
      # A `-timeout=30m` expiry is a *different* failure shape this
      # extraction alone is blind to: `go test` prints
      # `panic: test timed out after 30m0s` and the running tests' names,
      # but never a `--- FAIL:` line, so the grep above matches nothing —
      # checked explicitly via a separate `grep -c` rather than "is the
      # extracted text empty", because the trailing `grep '^FAIL'` for the
      # package summary line still matches even when the `--- FAIL:`
      # extraction itself found nothing, which silently defeated an
      # earlier, simpler version of this fallback (independent review,
      # uc-infra#240 — verified empirically: the combined text was never
      # actually empty, so that version's fallback never triggered and a
      # timeout still published a near-empty, test-name-less summary).
      # Falling back to the full log when no `--- FAIL:` line exists at all
      # covers a timeout and any other failure shape this heuristic doesn't
      # anticipate, the same way. `tail -c 900000` bounds either branch to
      # comfortably under $GITHUB_STEP_SUMMARY's 1MiB-per-step cap even if
      # many tests fail at once (verified against a 200-failure fixture:
      # 376KB, every `--- FAIL:` marker retained). The outer fence uses
      # four backticks so a test's own output containing a plain ``` (e.g.
      # dumping Markdown content) can't close it early.
      - name: Publish failing test output to step summary
        if: failure()
        run: |
          LOG="${RUNNER_TEMP}/test-output.log"
          {
            echo "## Test step failure detail (uc-infra#240)"
            if [ ! -f "$LOG" ]; then
              echo "\`test-output.log\` not found — the Test step likely never ran (an earlier step failed first)."
            else
              FAIL_LINES=$(grep -c -- '--- FAIL:' "$LOG" 2>/dev/null || true)
              if [ "${FAIL_LINES:-0}" -eq 0 ]; then
                EXTRACT="$(cat "$LOG")"
              else
                EXTRACT=$( { grep -B 60 -A 30 -- '--- FAIL:' "$LOG"; echo; grep '^FAIL' "$LOG"; } 2>/dev/null || true )
              fi
              echo '````'
              printf '%s\n' "$EXTRACT" | tail -c 900000
              echo '````'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage gate
        if: always()
        env:
          GOMODCACHE: ${{ runner.temp }}/gomodcache
          GOCACHE: ${{ runner.temp }}/gobuildcache
        # Floor only ever ratchets up (CLAUDE.md's "Testing" section) —
        # never lower this number to make a change pass; close the gap
        # with tests instead. Baseline set 2026-08-02 from this same
        # measurement, with a real browser present so internal/e2e's 49
        # tests actually ran rather than skipping: 84.5% measured, floor
        # set to 83.5 (1.0pp headroom — independent review flagged the
        # first attempt's 0.1pp as too thin a margin for a single-run
        # measurement) (see
        # uc-infra/docs/code-reviews/2026-08-02-tdd-coverage-gate.md for
        # the full baseline run and why the first attempt was discarded).
        # `if: always()`: run even if the Test step above already failed,
        # so a failing build still gets a coverage breakdown to look at.
        run: |
          if [ ! -f coverage.out ]; then
            echo "::error::coverage.out not found — the Test step above did not produce one (likely failed before finishing); nothing to gate."
            exit 1
          fi
          echo "--- Lowest-covered functions (bottom 15) ---"
          go tool cover -func=coverage.out | grep -v '^total:' | awk -F'\t+' '{pct=$NF; gsub("%","",pct); print pct"\t"$0}' | sort -n -k1,1 | cut -f2- | head -15 || true
          echo "---"
          COVERAGE_FLOOR=83.5
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Whole-program coverage: ${TOTAL}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$TOTAL" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' || {
            echo "::error::Coverage ${TOTAL}% is below the ${COVERAGE_FLOOR}% floor. This gate only ratchets up — add tests to close the gap, never lower the floor to pass."
            exit 1
          }
