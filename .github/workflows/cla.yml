name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

# One run per PR at a time — rapid synchronize/comment events must not
# race two jobs writing the same signatures file.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    # For issue_comment events, only react on pull-request threads — the
    # action cannot resolve a plain issue and would fail noisily in public.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # SECURITY: this workflow runs on pull_request_target and therefore
      # has write permissions. It must NEVER check out or execute code
      # from the PR head — the CLA action below operates purely on the
      # GitHub API. Do not add an actions/checkout step here.
      #
      # Pinned to the commit behind v2.6.1 — a mutable tag could be
      # re-pointed at code that would inherit this job's write access.
      - name: CLA assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          contains(github.event.comment.body, 'I have read the CLA Document') ||
          github.event.comment.body == 'recheck'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/universaltill/universal-core/blob/main/CLA.md
          branch: cla-signatures
          # Only the project owner is exempt; other maintainers sign like
          # any contributor so their work also carries the CLA grant.
          allowlist: farshid3003,*[bot]
          lock-pullrequest-aftermerge: false
